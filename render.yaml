# Vetra Render Blueprint — Free-tier infrastructure-as-code
# Docs: https://docs.render.com/blueprint-spec
services:
  - type: web
    name: vetraapi
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm install; npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        value: https://cloudgptapi.onrender.com
      # AI Provider keys — set these in Render dashboard (Settings → Environment)
      # We do NOT commit secrets to Git.
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OR_KEY
        sync: false
      - key: KIVEST_API_KEY
        sync: false
      - key: SHALOM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      # Auth — Kinde (set in dashboard)
      - key: KINDE_CLIENT_ID
        sync: false
      - key: KINDE_CLIENT_SECRET
        sync: false
      - key: KINDE_ISSUER_URL
        sync: false
      - key: KINDE_SITE_URL
        value: https://cloudgptapi.onrender.com
      - key: KINDE_POST_LOGOUT_REDIRECT_URL
        value: https://cloudgptapi.onrender.com
      - key: KINDE_POST_LOGIN_REDIRECT_URL
        value: https://cloudgptapi.onrender.com/dashboard
      # Optional: Supabase (not required for basic API operation)
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Optional: Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
